<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 480">
  <title id="title">Agari — own the stock, call the move</title>
  <desc id="desc">A dark market tape with a rising vermilion price line, large Agari wordmark and three steps: Own, Cover, Verify.</desc>
  <rect width="1200" height="480" fill="#201D1A"/>
  <rect width="14" height="355" fill="#C23F1C"/>
  <path d="M52 54H1148M52 326H1148" stroke="#746B62" stroke-width="1"/>
  <text x="55" y="82" fill="#E9633F" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4">STOCKS  /  SOLANA  /  AGARI</text>
  <text x="1147" y="82" text-anchor="end" fill="#D0C5B7" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">短い窓・確かな記録</text>
  <text x="42" y="219" fill="#F4EEE3" font-family="Arial,sans-serif" font-size="154" font-weight="900" letter-spacing="-12">AGARI</text>
  <text x="1146" y="310" text-anchor="end" fill="#C7BDB1" font-family="Arial,sans-serif" font-size="17" letter-spacing="2">PRICE WINDOW  ·  UP / DOWN</text>
  <path d="M55 298L178 281L296 301L418 258L527 269L640 234L746 253L840 197L950 220L1056 157L1144 172" fill="none" stroke="#E9633F" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>
  <g fill="#E9633F">
    <rect x="173" y="269" width="10" height="25"/><rect x="413" y="246" width="10" height="27"/>
    <rect x="635" y="221" width="10" height="27"/><rect x="835" y="184" width="10" height="29"/>
    <rect x="1051" y="142" width="10" height="30"/>
  </g>
  <rect y="355" width="1200" height="125" fill="#F4EEE3"/>
  <path d="M400 375V455M800 375V455" stroke="#D7CBBE"/>
  <text x="54" y="401" fill="#C23F1C" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">01 / OWN</text>
  <text x="54" y="438" fill="#211C18" font-family="Arial,sans-serif" font-size="23" font-weight="700">Keep your stock.</text>
  <text x="454" y="401" fill="#C23F1C" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">02 / COVER</text>
  <text x="454" y="438" fill="#211C18" font-family="Arial,sans-serif" font-size="23" font-weight="700">Call Up or Down.</text>
  <text x="854" y="401" fill="#C23F1C" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">03 / VERIFY</text>
  <text x="854" y="438" fill="#211C18" font-family="Arial,sans-serif" font-size="23" font-weight="700">Read the print.</text>
</svg>
