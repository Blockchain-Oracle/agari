# LiteSVM integration tests for agari-events (S2). An isolated workspace with its own Cargo.lock, so test-only
# dependencies never move the program's pins (solana-program 3.0.0, D-002). litesvm 0.16.0 (plan §1) shares
# solana-instruction 3.4 and solana-address 2.6 with anchor-lang 1.2 here, so Pubkey/Instruction types unify.
# Run after `NO_DNA=1 anchor build` (it loads target/deploy/agari_events.so):
#   cargo test --manifest-path anchor/tests/Cargo.toml
[workspace]

[package]
name = "agari-events-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[test]]
name = "events_admin"
path = "events_admin.rs"

[[test]]
name = "events_orders"
path = "events_orders.rs"

[[test]]
name = "events_prints"
path = "events_prints.rs"

[[test]]
name = "events_settle"
path = "events_settle.rs"

[[test]]
name = "events_redeem"
path = "events_redeem.rs"

[[test]]
name = "events_closure"
path = "events_closure.rs"

# S6 lane 6a: the real 09-11 → 09-14 Monday Gap replay and the lock race (session-lanes.md §1.6).
[[test]]
name = "events_gap"
path = "events_gap.rs"

# S6 lane 6c: a halted Pyth feed gives no print and the Window voids (session-lanes.md §3).
[[test]]
name = "events_halt_void"
path = "events_halt_void.rs"

# S7a: agari-vault suites (vault.md §10).
[[test]]
name = "vault_caps"
path = "vault_caps.rs"

[[test]]
name = "vault_funding"
path = "vault_funding.rs"

[[test]]
name = "vault_trading"
path = "vault_trading.rs"

# S6 lane 6b: a real Switchboard quote on the upgraded program (session-lanes.md §2.6).
[[test]]
name = "events_switchboard"
path = "events_switchboard.rs"

# D-088: a Listed Window rests PostOnly quotes before its open print.
[[test]]
name = "events_preopen"
path = "events_preopen.rs"

# S21: agari-desk suites (desk.md §9) on the stub router and a PreStocks-shaped Token-2022 name.
[[test]]
name = "desk_open"
path = "desk_open.rs"

[[test]]
name = "desk_funding"
path = "desk_funding.rs"

[[test]]
name = "desk_guards"
path = "desk_guards.rs"

[[test]]
name = "desk_reference"
path = "desk_reference.rs"

[[test]]
name = "desk_chain"
path = "desk_chain.rs"

[dependencies]
agari-events = { path = "../programs/agari-events", features = ["no-entrypoint"] }
agari-vault = { path = "../programs/agari-vault", features = ["no-entrypoint"] }
agari-desk = { path = "../programs/agari-desk", features = ["no-entrypoint"] }
agari-swap-stub = { path = "../programs/agari-swap-stub", features = ["no-entrypoint"] }
agari-common = { path = "../crates/agari-common" }
anchor-lang = "=1.2.0"
anchor-spl = "=1.2.0"
bytemuck = "1.25"
litesvm = { version = "=0.16.0", features = ["precompiles"] }
solana-account = "4.3"
solana-clock = "3.1"
solana-instruction-error = "2.4"
solana-keypair = "3.1.2"
solana-message = "4.2"
solana-signer = "3.0.1"
solana-transaction = "4.1"
solana-transaction-error = "3.3"
# S2 lane P: real Pyth fixture decoding, synthetic RedStone signing, ed25519 attestations.
base64 = "0.22"
k256 = { version = "0.13.4", features = ["ecdsa"] }
pyth-solana-receiver-sdk = "=2.0.0"
sha3 = "0.10"
# S7a: the caps vectors are read from packages/core/src/vault/caps.vectors.json.
serde_json = "1"
# S21: the desk's Token-2022 fixtures (TransferFee, ScaledUiAmount, Pausable, DefaultAccountState) and an independent
# sha256 for the chain-head recompute in desk_chain.rs.
spl-token-2022-interface = "2.1.0"
sha2 = "0.10"

# S6 lane 6b: a real Switchboard quote needs its slot in SlotHashes.
solana-hash = "4.5"
solana-slot-hashes = "=3.1.0"
