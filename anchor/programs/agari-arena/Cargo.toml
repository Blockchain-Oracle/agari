[package]
name = "agari-arena"
version = "0.1.0"
description = "Masayume's GameArena on Solana: a two-player duel over real Windows, each card one confirmed IOC pick, and only the side-pot the arena's to award"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "agari_arena"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true, features = ["event-cpi", "init-if-needed"] }
anchor-spl = { workspace = true }
bytemuck = { workspace = true }
agari-common = { path = "../../crates/agari-common" }
agari-events = { path = "../agari-events", features = ["cpi"] }
solana-keccak-hasher = "=3.1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

