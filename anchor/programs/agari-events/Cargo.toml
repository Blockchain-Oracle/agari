[package]
name = "agari-events"
version = "0.1.0"
description = "DreamDEX Event Contracts rebuilt as an Anchor CLOB: Windows, books, ledgers, prints, settlement"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "agari_events"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true, features = ["event-cpi"] }
anchor-spl = { workspace = true }
bytemuck = { workspace = true }
agari-common = { path = "../../crates/agari-common", features = ["pyth", "redstone", "switchboard"] }
# Default feature = receiver rec5EKMGg6MxZYaMdyBfgwp4d5rB9T1VQH5pJv5LtFJ (D-021: both devnet receivers verify the trial
# update Full on a Surfpool devnet fork; the SDK and the relay default to this one).
pyth-solana-receiver-sdk = { workspace = true }
solana-instructions-sysvar = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
