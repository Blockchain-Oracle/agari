[package]
name = "agari-strategy"
version = "0.1.0"
description = "Masayume's StrategyRegistry on Solana: who may copy-trade whom, under which ceilings, for what fee"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "agari_strategy"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true, features = ["event-cpi", "init-if-needed"] }
anchor-spl = { workspace = true }
agari-vault = { path = "../agari-vault", features = ["cpi"] }
# Already in the lockfile through anchor-lang; named here for the sha256 syscall `seal` checks the metadata with.
solana-sha256-hasher = "=3.1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
bytemuck = { workspace = true }
