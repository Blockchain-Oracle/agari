<text x="32" y="183" class="row">01 · Oracle-verified policy</text><g><rect x="32" y="200" width="308" height="152" rx="15" class="node"/><text x="52" y="227" class="num">1.1</text><text class="title" x="52" y="266">Pyth, RedStone or</text><text class="title" x="52" y="289">Switchboard</text><text class="sub" x="52" y="320">Source-specific signed update</text></g><g><rect x="382" y="200" width="308" height="152" rx="15" class="node"/><text x="402" y="227" class="num">1.2</text><text class="title" x="402" y="266">Price relay</text><text class="sub" x="402" y="320">Fetch boundary evidence</text></g><g><rect x="732" y="200" width="308" height="152" rx="15" class="node"/><text x="752" y="227" class="num">1.3</text><text class="title" x="752" y="266">On-chain verifier</text><text class="sub" x="752" y="320">Signature + time + policy</text></g><g><rect x="1082" y="200" width="308" height="152" rx="15" class="node"/><text x="1102" y="227" class="num">1.4</text><text class="title" x="1102" y="266">Recorded print</text><text class="sub" x="1102" y="320">Opening or closing value</text></g><path d="M342 276h31" class="arrow" marker-end="url(#tip)"/><text x="355" y="379" class="arrow-label" text-anchor="middle">signed material</text><path d="M692 276h31" class="arrow" marker-end="url(#tip)"/><text x="705" y="379" class="arrow-label" text-anchor="middle">record instruction</text><path d="M1042 276h31" class="arrow" marker-end="url(#tip)"/><text x="1055" y="379" class="arrow-label" text-anchor="middle">accepted value</text><text x="32" y="418" class="row">02 · PreStocks policy</text><g><rect x="32" y="435" width="308" height="152" rx="15" class="node"/><text x="52" y="462" class="num">2.1</text><text class="title" x="52" y="501">PreStocks catalogue</text><text class="sub" x="52" y="555">Unsigned token prices</text></g><g><rect x="382" y="435" width="308" height="152" rx="15" class="node"/><text x="402" y="462" class="num">2.2</text><text class="title" x="402" y="501">Agari attestor</text><text class="sub" x="402" y="555">Signs the venue's read</text></g><g><rect x="732" y="435" width="308" height="152" rx="15" class="node"/><text x="752" y="462" class="num">2.3</text><text class="title" x="752" y="501">On-chain verifier</text><text class="sub" x="752" y="555">Attestor + boundary</text></g><g><rect x="1082" y="435" width="308" height="152" rx="15" class="node"/><text x="1102" y="462" class="num">2.4</text><text class="title" x="1102" y="501">Recorded print</text><text class="sub" x="1102" y="555">Token dollars or basket points</text></g><path d="M342 511h31" class="arrow" marker-end="url(#tip)"/><text x="355" y="614" class="arrow-label" text-anchor="middle">one sample</text><path d="M692 511h31" class="arrow" marker-end="url(#tip)"/><text x="705" y="614" class="arrow-label" text-anchor="middle">signed by venue</text><path d="M1042 511h31" class="arrow" marker-end="url(#tip)"/><text x="1055" y="614" class="arrow-label" text-anchor="middle">accepted value</text><text x="32" y="653" class="row">03 · Resolution</text><g><rect x="32" y="670" width="308" height="152" rx="15" class="node"/><text x="52" y="697" class="num">3.1</text><text class="title" x="52" y="736">Opening print</text><text class="sub" x="52" y="790">Value at the first boundary</text></g><g><rect x="382" y="670" width="308" height="152" rx="15" class="node"/><text x="402" y="697" class="num">3.2</text><text class="title" x="402" y="736">Closing print</text><text class="sub" x="402" y="790">Value at the lock boundary</text></g><g><rect x="732" y="670" width="308" height="152" rx="15" class="node"/><text x="752" y="697" class="num">3.3</text><text class="title" x="752" y="736">Settle or void</text><text class="sub" x="752" y="790">Permissionless program call</text></g><g><rect x="1082" y="670" width="308" height="152" rx="15" class="node"/><text x="1102" y="697" class="num">3.4</text><text class="title" x="1102" y="736">Proof page</text><text class="sub" x="1102" y="790">Source + transactions</text></g><path d="M342 746h31" class="arrow" marker-end="url(#tip)"/><text x="355" y="849" class="arrow-label" text-anchor="middle">boundary comparison</text><path d="M692 746h31" class="arrow" marker-end="url(#tip)"/><text x="705" y="849" class="arrow-label" text-anchor="middle">program decision</text><path d="M1042 746h31" class="arrow" marker-end="url(#tip)"/><text x="1055" y="849" class="arrow-label" text-anchor="middle">public read</text>
