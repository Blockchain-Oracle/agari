<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heading description" viewBox="0 0 1400 1010">
<title id="heading">A devnet prediction Window</title><desc id="description">The owner signs a call; operators keep the clock and prints moving; the programs decide the result. Three rows of four connected stages. Node details and authority boundaries are available in the interactive documentation.</desc>
